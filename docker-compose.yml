services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Documented persistence layer (see PLAN.md). The API runs without it today;
  # this service is provided so the storage tier can be wired in.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: news
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
